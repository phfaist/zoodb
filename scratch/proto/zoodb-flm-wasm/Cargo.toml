[package]
name = "zoodb-flm-wasm-proto"
version = "0.0.1"
edition = "2024"
rust-version = "1.86"
license = "MIT"
publish = false
description = "Step-zero prototype: flm-core compiled to WebAssembly for @phfaist/zoodb (not the real crate)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Prototype only: a path dependency on the local flm-rs checkout (read-only).
# Where flm-rs is referenced from in the real crate is settled later (Q17).
flm-core = { path = "/Users/philippe/projects/flm-rs/flm-core", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
debug-panics = ["dep:console_error_panic_hook"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

[package.metadata.wasm-pack.profile.release.wasm-bindgen]
omit-default-module-path = true

# Standalone package: never absorbed into another workspace.
[workspace]
