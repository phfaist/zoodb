# The cargo workspace of the Rust bindings of @phfaist/zoodb (see README.md).
# Run cargo from this directory; `yarn build:wasm` at the repository root builds
# both WebAssembly modules (tools/build_wasm.mjs).

[workspace]
resolver = "3"
members = [
    "zoodb-autocitefetch-wasm",     # the citation retriever (crates.io `autocitefetch`)
    "zoodb-flm-wasm",               # the FLM engine (`flm-core`) with the ZooDb feature
]

# Profiles live here only: cargo ignores them in the members' manifests.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
