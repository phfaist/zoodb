# This workflow will do a clean installation of node dependencies, cache/restore
# them, build the source code and run tests across different versions of node
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: 'Node.js Test CI'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - '18'
          - '20'
          - '22'
          #- '24'
        
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
      
        
      - name: 'Install Node.JS (${{ matrix.node-version }})'
        uses: actions/setup-node@v3
        with:
          node-version: '${{ matrix.node-version }}'

      - name: 'Enable Yarn'
        run: 'corepack enable'
      
      - name: 'Inspect Yarn version'
        run: 'yarn --version'
      
      # Cache Yarn Modules
      - name: 'Get yarn cache directory path'
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        shell: bash
  
      - name: 'Restore yarn cache'
        uses: actions/cache@v3
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: yarn-cache-folder-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-cache-folder-
  
      - run: 'yarn'
  
      - run: 'yarn test'


      # Try to compile our example zoodb "PeopleDB"

      - name: 'Clone example ZooDB repo'
        run: 'git clone https://github.com/phfaist/zoodb-example.git'

      - name: 'Use Version of ZooDb that we want to test'
        run: 'yarn up @phfaist/zoodb@https://github.com/${{ github.repository }}.git#${{ github.sha }}'
        working-directory: ./zoodb-example/

      - name: 'Build example ZooDB (Only for Node ≥ 20)'
        run: |
          if [[ ${{ matrix.node-version }} == "latest" || ${{ matrix.node-version }} -ge 20 ]]; then
              echo "Building test website [Node $(yarn node --version)]"
              yarn build
          else
              echo "Skipping test build website [Node $(yarn node --version)]"
          fi
        working-directory: ./zoodb-example/website


  # Build and check the Rust binding of the autocitefetch citation retriever
  # (rust/).  The generated module in src/citationmanager/_wasm/ is committed
  # and is not compared with this build's output (wasm-opt is not
  # byte-reproducible across versions).
  rust:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust (stable, with the wasm32-unknown-unknown target)'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: 'Cache cargo'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 'Install wasm-pack'
        run: 'command -v wasm-pack || cargo install wasm-pack --locked'

      - name: 'cargo clippy'
        run: 'cargo clippy --all-targets -- -D warnings'

      - name: 'cargo test'
        run: 'cargo test'

      - name: 'Build the wasm module (build only)'
        run: 'wasm-pack build --release --target web --out-dir target/pkg --out-name autocitefetch_wasm'
