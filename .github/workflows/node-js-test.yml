# This workflow will do a clean installation of node dependencies, cache/restore
# them, build the source code and run tests across different versions of node
# For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: 'Node.js Test CI'

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version:
          - '20'
          - '22'
          #- '24'
        
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v3
      
        
      - name: 'Install Node.JS (${{ matrix.node-version }})'
        uses: actions/setup-node@v3
        with:
          node-version: '${{ matrix.node-version }}'

      - name: 'Enable Yarn'
        run: 'corepack enable'
      
      - name: 'Inspect Yarn version'
        run: 'yarn --version'
      
      # Cache Yarn Modules
      - name: 'Get yarn cache directory path'
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT
        shell: bash
  
      - name: 'Restore yarn cache'
        uses: actions/cache@v3
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: yarn-cache-folder-${{ hashFiles('**/yarn.lock', '.yarnrc.yml') }}
          restore-keys: |
            yarn-cache-folder-
  
      - run: 'yarn'
  
      - run: 'yarn lint'

      - run: 'yarn test'


      # Try to compile our example zoodb "PeopleDB"
      #
      # PENDING: these steps clone the default branch of zoodb-example, which
      # still uses the FLM API of zoodb 0.2. The port to zoodb 0.3 is on that
      # repository's branch `zoodb-flmrs`, not merged (nor pushed) yet; until it
      # reaches the default branch, these steps fail against this version of
      # zoodb. Once the branch is pushed, the clone can name it
      # (`git clone --branch zoodb-flmrs ...`); once it is merged, nothing here
      # needs to change.

      - name: 'Clone example ZooDB repo'
        run: 'git clone https://github.com/phfaist/zoodb-example.git'

      - name: 'Use Version of ZooDb that we want to test'
        run: 'yarn up @phfaist/zoodb@https://github.com/${{ github.repository }}.git#${{ github.sha }}'
        working-directory: ./zoodb-example/

      - name: 'Build example ZooDB'
        run: |
          echo "Building test website [Node $(yarn node --version)]"
          yarn build
        working-directory: ./zoodb-example/website


  # Build and check the Rust bindings of the cargo workspace in rust/: the
  # citation retriever (zoodb-autocitefetch-wasm) and the FLM engine
  # (zoodb-flm-wasm).  The generated modules in src/citationmanager/_wasm/ and
  # src/zooflm/_wasm/ are committed and are not compared with this build's
  # output (wasm-opt is not byte-reproducible across versions).
  #
  # Each crate is checked in its own cargo invocation: one invocation over both
  # would unify serde_json's features and compile the citation crate with
  # `serde_json/std`, which it must never be built with (see rust/README.md).
  #
  # zoodb-flm-wasm depends on flm-core through a path to a local checkout of
  # flm-rs, which this runner does not have; cargo cannot load the workspace
  # without it, so this job fails at its first cargo command until flm-rs is
  # referenced from a location CI can reach (to be settled).
  rust:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: rust

    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust (stable, with the wasm32-unknown-unknown target)'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy

      - name: 'Cache cargo'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/wasm-pack
            rust/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'rust/rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: 'Install wasm-pack'
        run: 'command -v wasm-pack || cargo install wasm-pack --locked'

      - name: 'cargo clippy'
        run: |
          cargo clippy -p zoodb-autocitefetch-wasm --all-targets -- -D warnings
          cargo clippy -p zoodb-flm-wasm --all-targets -- -D warnings

      - name: 'cargo test'
        run: |
          cargo test -p zoodb-autocitefetch-wasm
          cargo test -p zoodb-flm-wasm

      - name: 'Build the wasm modules (build only)'
        run: |
          wasm-pack build zoodb-autocitefetch-wasm --release --target web --out-dir ../target/pkg/zoodb-autocitefetch-wasm --out-name autocitefetch_wasm
          wasm-pack build zoodb-flm-wasm --release --target web --out-dir ../target/pkg/zoodb-flm-wasm --out-name zoodb_flm_wasm
